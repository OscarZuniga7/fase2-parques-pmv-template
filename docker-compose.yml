services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definir en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-parques}
      MYSQL_USER: ${MYSQL_USER:-alumno}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Definir en .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 40

  phpmyadmin:
    image: phpmyadmin:5.2
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8090:80"
    depends_on:
      mysql:
        condition: service_healthy

  streamlit:
    build: .
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-parques}
      DB_USER: ${MYSQL_USER:-alumno}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Definir en .env}
    ports:
      - "8501:8501"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
